// file: main.ms
function()
init = function()
  
  gameState = "title" // gamestate: "title", "game", "gameover"
  
  //vke
  
  vke = object
  
    x = 0
    y = -50
    speed = 2
  
  end
  
  //oponent_fighter
  
  enemies = []
  
  enemy_bullets = []  // oponent_fighter's bullets
  
  // Function to create a wave of oponents
  spawnEnemies = function()
    enemies = []
    for i = 0 to 9
      local e = object
        x = -80 + (i * 18)
        y = 50
        speed = 0.3
        dir = 1
        shoot_timer = random.next() * 100 // Randomizing shooting timing
      end
      enemies.push(e)
    end
  end

  bullets = [] 
  
  score = 0
  
  stage = 1
  
end

update = function()
  
  if gameState == "title" then
    // Mouse action
    if mouse.press then
      score = 0
      spawnEnemies()
      gameState = "game"
      audio.playMusic("introsolo2" 0.5 false)
    end
    
  
  elsif gameState == "game" then
  
  if keyboard.UP then
    
    vke.y = vke.y + vke.speed
    
  end
  
   if keyboard.RIGHT then
    
    vke.x = vke.x + vke.speed
    
   end

 if keyboard.DOWN then
    
    vke.y = vke.y - vke.speed
    
 end

 if keyboard.LEFT then
    
    vke.x = vke.x - vke.speed
    
 end

  if keyboard.press.Z  then

   local v_bullet = object
      x = vke.x
      y = vke.y + 10
      speed = 5
    end
    bullets.push(v_bullet)
    audio.beep("square tempo 6000 volume 10 span 100 E6 to E7")
    
  end
  
   for b in bullets
    b.y = b.y + b.speed
  end
  
  for i = 0 to bullets.length - 1
    if bullets[i].y > 110 then bullets.removeAt(i) end
  end
  
  //oponent movement
  
  for e in enemies
    e.x = e.x + (e.speed * e.dir)
    if e.x > 90 or e.x < -90 then e.dir = e.dir * -1 end
    
        // Enemy shooting (only Stage 2)
    if stage == 2 then
      e.shoot_timer = e.shoot_timer + 1
      
        local eb = object
          x = e.x 
          y = e.y - 5
          speed = 1
        end
      
      if e.shoot_timer > 100 then // Approximately once in 2 seconds (60 frames = 1 second)

        enemy_bullets.push(eb)
        e.shoot_timer = 0
        audio.beep("square tempo 6000 volume 10 span 100 B2 to B3")
      end
      
    // Enemy bullets moving down
    for i = enemy_bullets.length - 1 to 0 step -1
    eb = enemy_bullets[i]
    eb.y = eb.y - eb.speed
    
    // Check if enemy hit player
    if abs(eb.x - vke.x) < 8 and abs(eb.y - vke.y) < 8 then
      gameState = "gameover"
      audio.beep("square tempo 4000 volume 10 span 100 F6 to F7")
    end
    
    if eb.y < -110 then enemy_bullets.removeAt(i) end
    
    end
    
  end
  

  end
  
  if enemies.length > 0 then

    // Checking bullets collision (reverse cycle for safe remove)
    for i = bullets.length - 1 to 0 step -1
      local b = bullets[i]
      
      for j = enemies.length - 1 to 0 step -1
        local e = enemies[j]
        
        // Проверка попадания
        if abs(b.x - e.x) < 10 and abs(b.y - e.y) < 10 then
          enemies.removeAt(j)
          bullets.removeAt(i)
          score = score + 10
          audio.beep("square tempo 6000 volume 10 span 100 A1 to A2")
          break // If bullet removed quitting inner cycle
        end
      end
    end
    
    if stage == 1 and enemies.length == 0 then
      stage = 2
      spawnEnemies(10) // Creating new emies for stage 2
      audio.beep("square tempo 600 volume 10 span 100 A6 to A7") // Sound of new stage
    end
  

  end
  
    if stage == 2 and enemies.length == 0 then
     
      if mouse.press then
        gameState = "title"
        stage = 1
        while enemy_bullets.length>0
          enemy_bullets.removeAt(0)
        end
      end
    
    end
  
  end
  
  if gameState == "gameover" then
  if mouse.press then
    stage = 1
    score = 0
    enemy_bullets = []
    bullets = []
    spawnEnemies(10)
    gameState = "title"
  end
end
  

  
end

draw = function()
  screen.clear()
    if gameState == "title" then
    // Title screen
    screen.drawText("YOROSHIKU", 0, 40, 25, "yellow")
    screen.drawSprite("vke", 0, 0, 40, 40) // Vke's big sprite
    
    // Blinking message
    if system.time() % 1000 < 500 then
      screen.drawText("CLICK TO START", 0, -50, 15, "white")
    end
    
    screen.drawText("move: arrow keys and shoot: Z key", 0, -70, 10, "white")
    
  elsif gameState == "game" then
  
    screen.drawSprite("vke", 0+vke.x, 0+vke.y, 20, 20)
    
    // Drawing the score
    screen.drawText("SCORE: " + score, -80, 90, 10, "white")
    
    // Enemies
    for e in enemies
      screen.drawSprite("oponent_fighter", e.x, e.y, 15, 15)
    end
    
    // Bullets
    for b in bullets
      screen.drawSprite("v_bullet", b.x, b.y, 6, 6)
    end
      // Win message
    if stage == 2 and enemies.length == 0 then
      screen.drawText("YOU WIN!", 0, 0, 30, "yellow")
      screen.drawText("CLICK TO RESTART", 0, -30, 15, "white")
    end
    
    for eb in enemy_bullets
      screen.fillRect(eb.x, eb.y, 2, 8, "red")
    end
  
    elsif gameState == "gameover" then
      //screen.fillRect(0, 0, 400, 400, "rgba(0,0,0,0.7)")
      screen.drawText("GAME OVER", 0, 10, 30, "red")
      screen.drawText("CLICK TO RESTART", 0, -30, 15, "white")
    end
end
end()
